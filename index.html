<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabWhisper — AI research notes for anything you read</title>
    <meta name="description" content="Paste a URL or any text and get a clear summary, key points, action items, and answers to your questions." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16161d" />
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist+Mono:wght@400;500&family=Geist:wght@300..700&display=swap" />
    <style>
      :root {
        --font-geist-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
        --font-geist-mono: "Geist Mono", ui-monospace, monospace;
        --font-serif: "Fraunces", ui-serif, Georgia, serif;
      }
    </style>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="flex min-h-full flex-col">
    <div id="root" class="flex min-h-full flex-1 flex-col"></div>
    <noscript>TabWhisper needs JavaScript to run.</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
